<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 | 백석총회 교회정보팀</title>
<meta name="description" content="교회정보팀 회원가입 — 정보 등록과 연결 요청을 이용하실 수 있습니다.">
<meta name="theme-color" content="#101E36">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css?v=20261127c">
</head>
<body data-menu="">
<div id="site-top"></div>

<section class="phero">
  <div class="im"><img src="assets/img/svc05.jpg" alt=""></div>
  <div class="wrap">
    <div class="crumb"><a href="index.html">홈</a><span class="sp">›</span><b>회원가입</b></div>
    <h1>회원가입</h1>
    <p class="sub">교회와 사역자를 연결하는 자리에 함께해 주세요. 가입 후 정보를 등록하실 수 있습니다.</p>
  </div>
</section>

<div class="pagebody">
  <div class="wrap" style="max-width:680px">
    <div class="fcard">
      <h2>회원 정보</h2>
      <p class="lead">교회 정보를 정확히 적어 주시면 연결이 빨라집니다.</p>
      <form id="joinForm">
        <div class="frow"><label>이름<em>*</em></label><div class="ctl"><input type="text" name="name" required placeholder="홍길동"></div></div>
        <div class="frow"><label>교회·단체<em>*</em></label><div class="ctl"><input type="text" name="church" required placeholder="은혜한빛교회"></div></div>
        <div class="frow"><label>소속 노회</label><div class="ctl"><input type="text" name="presbytery" placeholder="예) 서울노회"></div></div>
        <div class="frow"><label>직분</label><div class="ctl"><select name="role"><option>담임목사</option><option>목사</option><option>강도사·전도사</option><option>장로</option><option>집사·성도</option><option>기타</option></select></div></div>
        <div class="frow"><label>이메일<em>*</em></label><div class="ctl"><input type="email" name="email" required placeholder="name@church.kr"><span class="hint">아이디로 사용됩니다.</span></div></div>
        <div class="frow"><label>비밀번호<em>*</em></label><div class="ctl"><div class="two"><input type="password" name="pw" required placeholder="8자 이상"><input type="password" name="pw2" required placeholder="한 번 더 입력"></div></div></div>
        <div class="frow"><label>휴대전화</label><div class="ctl"><input type="tel" name="phone" placeholder="010-0000-0000"><span class="hint">연락처는 공개되지 않으며 관리자만 확인합니다.</span></div></div>
        <div class="frow"><label>동의<em>*</em></label><div class="ctl">
          <label class="check"><input type="checkbox" name="a1" required> 이용약관에 동의합니다. <a href="policy.html" style="color:var(--gold)">보기</a></label>
          <label class="check"><input type="checkbox" name="a2" required> 개인정보 수집·이용에 동의합니다. <a href="policy.html" style="color:var(--gold)">보기</a></label>
        </div></div>
        <div class="fsubmit">
          <span class="hint">가입 후 관리자 확인을 거쳐 정보 등록이 가능합니다.</span>
          <span class="sp"></span>
          <button class="btn btn-gold" type="submit">가입하기</button>
        </div>
      </form>
      <div id="joinDone" style="display:none"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="js/data.js?v=20261127c"></script>
<script src="js/ui.js?v=20261127c"></script>
<script>
  UI.init('');
  document.getElementById('joinForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.pw.value !== f.pw2.value) { alert('비밀번호가 서로 다릅니다.'); return; }
    f.style.display = 'none';
    var d = document.getElementById('joinDone');
    d.style.display = 'block'; d.className = 'done-box';
    d.innerHTML = '<div class="ic">✓</div><h3>가입 신청이 접수되었습니다</h3>' +
      '<p>' + UI.esc(f.church.value) + ' · ' + UI.esc(f.name.value) + ' 님<br>관리자 확인 후 가입이 완료됩니다.</p>' +
      '<p style="font-size:11.5px;color:var(--slate-2)">※ 시안 화면으로 실제 가입은 되지 않습니다.</p>' +
      '<div style="margin-top:14px"><a class="btn btn-line" href="login.html">로그인 화면으로</a></div>';
  });
</script>
</body>
</html>
