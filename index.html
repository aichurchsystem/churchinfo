<section class="hero">

          <option value="rural">농어촌 연결</option>
          <option value="family">목회자 가정 지원</option>
          <option value="groupbuy">공동구매·제휴</option>

      <span class="div"></span>
      <div class="fld f2">
        <label for="qRegion">지역</label>
        <select id="qRegion" name="region">

      <span class="div"></span>
