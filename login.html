<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | 백석총회 교회정보팀</title>
<meta name="description" content="교회정보팀 로그인 — 정보 등록과 연결 요청을 이용하실 수 있습니다.">
<meta name="theme-color" content="#101E36">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css?v=20261127d">
</head>
<body data-menu="">
<div id="site-top"></div>

<section class="phero">
  <div class="im"><img src="assets/img/svc03.jpg" alt=""></div>
  <div class="wrap">
    <div class="crumb"><a href="index.html">홈</a><span class="sp">›</span><b>로그인</b></div>
    <h1>로그인</h1>
    <p class="sub">정보 등록과 연결 요청에는 로그인이 필요합니다. 게시된 정보는 로그인 없이도 보실 수 있습니다.</p>
  </div>
</section>

<div class="pagebody">
  <div class="wrap" style="max-width:520px">
    <div class="fcard">
      <h2>교회정보팀 로그인</h2>
      <p class="lead">가입하신 이메일과 비밀번호를 입력해 주세요.</p>
      <form id="loginForm">
        <div class="frow"><label>이메일<em>*</em></label><div class="ctl"><input type="email" name="email" required placeholder="name@church.kr"></div></div>
        <div class="frow"><label>비밀번호<em>*</em></label><div class="ctl"><input type="password" name="pw" required placeholder="비밀번호"></div></div>
        <div class="frow"><label></label><div class="ctl"><label class="check"><input type="checkbox" checked> 로그인 상태 유지</label></div></div>
        <div class="fsubmit">
          <span class="hint">비밀번호를 잊으셨다면 담당자에게 문의해 주세요.</span>
          <span class="sp"></span>
          <button class="btn btn-navy" type="submit" style="min-width:120px">로그인</button>
        </div>
      </form>
      <div id="loginMsg" style="display:none;margin-top:14px" class="notice-line"></div>
      <div style="display:flex;gap:8px;margin-top:18px;align-items:center;font-size:12px;color:var(--slate)">
        <span>아직 회원이 아니신가요?</span>
        <a href="join.html" style="color:var(--gold);font-weight:600">회원가입</a>
        <span style="margin-left:auto"><a href="admin.html" style="color:var(--slate-2)">관리자 데모 →</a></span>
      </div>
    </div>
    <p style="font-size:11.5px;color:var(--slate-2);margin-top:12px;line-height:1.7">※ 이 화면은 제작 시안입니다. 실제 회원 인증은 서버 구축 단계에서 연결됩니다.</p>
  </div>
</div>

<div id="site-footer"></div>
<script src="js/data.js?v=20261127d"></script>
<script src="js/ui.js?v=20261127d"></script>
<script>
  UI.init('');
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var m = document.getElementById('loginMsg');
    m.style.display = 'flex';
    m.innerHTML = '<span class="ic">ⓘ</span>시안 화면입니다. 실제 로그인은 서버 구축 후 동작합니다.';
  });
</script>
</body>
</html>
