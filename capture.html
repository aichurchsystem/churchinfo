<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>capture</title>
<style>html,body{margin:0;padding:0;background:#FAF9F6}iframe{border:0;display:block}</style></head>
<body><div id="stage"></div><script>
var q=new URLSearchParams(location.search),w=+(q.get('w')||1440),h=+(q.get('h')||1400),u=q.get('u')||'index.html';
var f=document.createElement('iframe');f.src=u;f.width=w;f.height=h;f.setAttribute('scrolling','no');
document.getElementById('stage').appendChild(f);document.body.style.height=h+'px';
</script></body></html>
