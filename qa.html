<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>QA</title>
<style>body{font:12px/1.5 monospace;margin:0;padding:12px;background:#fff}iframe{width:1440px;height:900px;border:1px solid #ddd;position:absolute;left:-9999px}pre{white-space:pre-wrap}</style>
</head><body><pre id="out">running…</pre>
<script>
const pages = ['index.html','jobs.html','space.html','goods.html','rural.html','family.html','groupbuy.html','search.html?q=%EA%B5%90%ED%9A%8C','item.html?id=J-2611-01','notice.html','data.html','presbytery.html','about.html','policy.html','register.html','admin.html','login.html','join.html'];
const res = [];
function one(p){
  return new Promise(resolve=>{
    const f=document.createElement('iframe'); f.src=p; document.body.appendChild(f);
    const errs=[];
    f.onload=()=>{ setTimeout(()=>{
      try{
        const d=f.contentDocument, w=f.contentWindow;
        res.push({page:p, title:d.title.slice(0,28), h:d.body.scrollHeight,
          overX: d.documentElement.scrollWidth>d.documentElement.clientWidth,
          rows: d.querySelectorAll('.row, .cd, .sv, .dBody tr, #aBody tr').length,
          emptyLists: [...d.querySelectorAll('ul')].filter(u=>u.children.length===0).length,
          h1: (d.querySelector('h1')||{}).textContent ? d.querySelector('h1').textContent.slice(0,24) : ''});
      }catch(e){ res.push({page:p, error:String(e)}); }
      f.remove(); resolve();
    }, 700); };
  });
}
(async()=>{ for(const p of pages) await one(p); document.getElementById('out').textContent = JSON.stringify(res,null,1); })();
</script></body></html>
